<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover est indispensable : sans lui, env(safe-area-inset-*) vaut 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FAF3EF" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Un compteur, une question, une réponse." />

    <!-- iOS ignore une partie du manifeste et privilégie ces balises. Il faut les deux. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BCGlove" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Écrans de démarrage. iOS n'accepte QUE la taille exacte de l'appareil :
      une taille approchante est ignorée en silence, et on retombe sur un
      rectangle blanc — ce qui, sur une app crème, se remarque.
      Régénérés par scripts/make-icons.mjs.
    -->
    <link rel="apple-touch-startup-image" href="/icons/splash-402x874.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-440x956.png"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-393x852.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-430x932.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-390x844.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-428x926.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-375x812.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-375x667.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-400-italic.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/nunito-var.woff2" crossorigin />

    <title>BCGlove</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
